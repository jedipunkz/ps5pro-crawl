name: PS5 Pro 在庫監視（常駐）

# GitHub の schedule は混雑時に数時間間引かれるため、cron だけでは数分間隔の監視が成り立たない。
# そこで 1 ジョブの中で在庫チェックをループさせ、ジョブの制限時間 (6h) に達する前に
# 自分自身を workflow_dispatch で起動し直してリレーする。
# Actions の分数を常時消費するので public リポジトリ（標準ランナー無料）でのみ使うこと。
#
# 止められないための抑制（GitHub と販売店の両方に対して）:
# - 深夜 JST 2:00〜7:00 はランナーを一切使わない（ループを終え、リレーもしない）
# - 間隔は 5 分 (CHECK_INTERVAL_SEC)。Chromium を使う店舗 (Amazon / エディオン) は BROWSER_EVERY 回に 1 回にも絞れる。
#   CPU 負荷と、データセンター IP を遮断しやすい店舗へのアクセス数を減らす
# - 間隔に 0〜JITTER_SEC 秒の揺らぎを入れ、機械的な周期にしない

on:
  # 朝の再開と、リレーが途切れたとき（ランナー障害など）の保険。
  # 監視中はこの起動は concurrency で待たされ、次のリレーと競合した側がキャンセルされる。
  # 時刻は UTC。22〜23 時と 0〜16 時 = JST 7:00〜25:59（深夜 2〜7 時は起動しない）
  schedule:
    - cron: '17 0-16,22,23 * * *'

  # 初回起動とリレー用。Actions タブから手動でも起動できる
  workflow_dispatch:

permissions:
  contents: read
  actions: write # 自分自身を workflow_dispatch で起動し直すため

concurrency:
  # 監視ループは常に 1 本だけ。手動の stock-check.yml とはグループを分け、
  # 手動実行が 6 時間待たされないようにしている。
  group: ps5pro-stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # ジョブの上限は 360 分。ループ (LOOP_MINUTES) の後に状態保存とリレーの時間を残す
    timeout-minutes: 350
    steps:
      # 深夜帯なら何もせずに終える。稼働する場合はループの終了時刻と、
      # 終了後にリレーするか（深夜帯に入って終わるならしない）を決める。
      - name: 稼働時間を決める
        id: window
        env:
          LOOP_MINUTES: '330'
          QUIET_START_JST: '2'
          QUIET_END_JST: '7'
        run: |
          set -euo pipefail
          now=$(date +%s)
          hour=$(TZ=Asia/Tokyo date +%-H)
          if [ "$hour" -ge "$QUIET_START_JST" ] && [ "$hour" -lt "$QUIET_END_JST" ]; then
            echo "深夜帯 (JST ${QUIET_START_JST}:00〜${QUIET_END_JST}:00) のため起動しません"
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          limit=$(( now + LOOP_MINUTES * 60 ))
          quiet=$(TZ=Asia/Tokyo date -d "$(TZ=Asia/Tokyo date +%F) ${QUIET_START_JST}:00" +%s)
          [ "$now" -ge "$quiet" ] && quiet=$(( quiet + 86400 ))
          if [ "$limit" -lt "$quiet" ]; then end=$limit relay=true; else end=$quiet relay=false; fi
          echo "ループ終了: $(TZ=Asia/Tokyo date -d "@$end" '+%F %T JST') / リレー: $relay"
          {
            echo "active=true"
            echo "end=$end"
            echo "relay=$relay"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.window.outputs.active == 'true'

      - uses: actions/setup-node@v4
        if: steps.window.outputs.active == 'true'
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
        if: steps.window.outputs.active == 'true'

      - name: Chromium をインストール
        if: steps.window.outputs.active == 'true'
        run: npx playwright install --with-deps chromium

      - name: 前回の状態を復元
        if: steps.window.outputs.active == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: ps5pro-state-${{ github.run_id }}
          restore-keys: |
            ps5pro-state-

      - name: 在庫チェックをループ実行
        if: steps.window.outputs.active == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
          NOTIFY_ON_ERROR: ${{ vars.NOTIFY_ON_ERROR }}
          NOTIFY_ON_SOLD_OUT: ${{ vars.NOTIFY_ON_SOLD_OUT }}
          ERROR_THRESHOLD: ${{ vars.ERROR_THRESHOLD }}
          INCLUDE_BLOCKED: ${{ vars.INCLUDE_BLOCKED }}
          BUDGET_MS: ${{ vars.BUDGET_MS }}
          # チェック開始から次のチェック開始までの秒数。前回が長引いた場合は待たずに次へ進む
          CHECK_INTERVAL_SEC: ${{ vars.CHECK_INTERVAL_SEC || '300' }}
          # Chromium を使う店舗を何回に 1 回チェックするか（それ以外は HTTP の店舗だけ）
          BROWSER_EVERY: ${{ vars.BROWSER_EVERY || '1' }}
          JITTER_SEC: '15'
          END_EPOCH: ${{ steps.window.outputs.end }}
        run: |
          set -uo pipefail

          if ! printf '%s' "$CHECK_INTERVAL_SEC" | grep -qE '^[0-9]+$' || [ "$CHECK_INTERVAL_SEC" -lt 30 ]; then
            echo "CHECK_INTERVAL_SEC は 30 以上の整数で指定してください: $CHECK_INTERVAL_SEC" >&2
            exit 1
          fi
          if ! printf '%s' "$BROWSER_EVERY" | grep -qE '^[1-9][0-9]*$'; then
            echo "BROWSER_EVERY は 1 以上の整数で指定してください: $BROWSER_EVERY" >&2
            exit 1
          fi

          end=$END_EPOCH
          n=0
          failed=0
          while [ "$(date +%s)" -lt "$end" ]; do
            n=$((n + 1))
            started=$(date +%s)
            # 1 回目は必ず全店舗。以降は BROWSER_EVERY 回に 1 回だけ Chromium の店舗を含める
            if [ $(( (n - 1) % BROWSER_EVERY )) -eq 0 ]; then scope=""; else scope="--http-only"; fi
            echo "::group::#$n $(date -u +%FT%TZ) ${scope:-全店舗}"
            # 1 回の失敗（全店舗判定不能など）でループを止めない。
            # ステップサマリーは 1MiB 上限があるため、ループ中は書き込ませない。
            if ! GITHUB_STEP_SUMMARY= node src/index.js $scope; then
              failed=$((failed + 1))
              echo "::warning::#$n の在庫チェックが失敗しました"
            fi
            echo "::endgroup::"

            wait=$(( CHECK_INTERVAL_SEC + RANDOM % (JITTER_SEC + 1) - ($(date +%s) - started) ))
            remain=$(( end - $(date +%s) ))
            [ "$wait" -gt "$remain" ] && wait=$remain
            [ "$wait" -gt 0 ] && sleep "$wait"
          done

          echo "実行 ${n} 回 / 失敗 ${failed} 回 / 間隔 ${CHECK_INTERVAL_SEC}〜$((CHECK_INTERVAL_SEC + JITTER_SEC)) 秒 / Chromium 店舗は ${BROWSER_EVERY} 回に 1 回" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 状態を保存
        if: always() && steps.window.outputs.active == 'true'
        uses: actions/cache/save@v4
        with:
          path: .state
          key: ps5pro-state-${{ github.run_id }}

      # 制限時間で正常にループを終えたときだけ次のジョブにリレーする。
      # 深夜帯に入って終えたときはリレーせず、朝の schedule で再開する。
      # 失敗・キャンセル時は毎時の schedule が再開させる。
      # 監視を完全に止めるには Actions タブでこのワークフローを Disable にする。
      - name: 次の監視ジョブを起動
        if: success() && steps.window.outputs.relay == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run stock-monitor.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
