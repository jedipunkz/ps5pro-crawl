<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>サービス終了</title>
<style>
:root{ --hero:#0e336f; --btn:#173b79; --card:#fff; --note-bg:#f8f9fd; --border:#e6e8ef;}
body{font-family:"Noto Sans JP",Meiryo,sans-serif;line-height:1.6;margin:20px;background:#f5f6fa;color:#1f2430}
.container{max-width:940px;margin:0 auto;padding:0 16px;}
.notice-hero .top{background:var(--hero);color:#fff;padding:22px}
h1{margin:8px 0 4px;font-size:1.26rem}
.top p{margin:0 0 12px;color:rgba(255,255,255,.95)}
.bottom{background:var(--card);padding:16px}
.btn{display:inline-flex;align-items:center;padding:10px 14px;border-radius:10px;background:var(--btn);color:#fff;text-decoration:none;font-weight:700}
.note a{color:#0b58c5;text-decoration:none}
@media (max-width:640px){h1{font-size:1.08rem}.top{padding:18px}.bottom{padding:14px}}
</style>
</head>
<body>
  <div class="container">
    <section class="notice-hero" aria-labelledby="notice-title">
      <div class="top">
        <span class="badge">お知らせ</span>
        <h1 id="notice-title">TSUTAYAオンラインショッピングは2025年10月31日をもちまして終了いたしました。</h1>
        <p>ご注文についてのお問い合わせは下記よりお願いいたします。</p>
      </div>
      <div class="bottom">
        <div class="cta">
          <a class="btn" href="https://ssl.help.tsite.jp/helpdesk?category_id=3116&site_domain=qa-store" target="_blank" rel="noopener">お問い合わせはこちら</a>
        </div>
      </div>
    </section>
    <div class="note">
      ※ サービス終了についての詳細は <a href="https://ssl.help.tsite.jp/faq/show/73415?site_domain=qa-store" target="_blank" rel="noopener">FAQ（よくある質問）</a> をご確認ください。
    </div>
  </div>
</body>
</html>
